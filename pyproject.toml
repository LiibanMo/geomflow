[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "geomflow"
version = "0.1.0"
description = "Intrinsic Riemannian Manifold Continuous Normalizing Flow Library"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "imageio>=2.31",
]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "torchdiffeq>=0.2",
    "pytest>=7.0",
]

[tool.scikit-build]
cmake.args = ["-DBUILD_TESTS=OFF", "-DBUILD_PYTHON=ON"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
