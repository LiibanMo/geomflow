[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=2.11.0",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "geomflow"
dynamic = ["version"]
description = "Intrinsic Riemannian Manifold Continuous Normalizing Flow Library"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "imageio>=2.31",
]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "torchdiffeq>=0.2",
    "pytest>=7.0",
]

[tool.scikit-build]
cmake.args = [
    "-DBUILD_TESTS=OFF",
    "-DBUILD_EXAMPLES=OFF",
    "-DBUILD_PYTHON=ON",
]
cmake.build-type = "Release"
wheel.packages = ["python/geomflow"]
sdist.include = ["python/geomflow/_version.py"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "python/geomflow/_version.py"

[tool.cibuildwheel]
build = "cp{312,313,314}-*"
test-requires = ["pytest>=7.0", "torchdiffeq>=0.2"]
test-sources = ["tests"]
test-command = "python -m pytest {project}/tests -m 'not slow'"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: long-running mathematical regression",
    "convergence: numerical order test using multiple refinements",
    "normalization: numerical integration or high-sample normalization test",
    "optional: test permitted to skip because an external capability is unavailable",
]
