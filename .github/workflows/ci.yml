name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        compiler: [gcc, clang]
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-14
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - os: macos-14
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake clang-format

      - name: Configure
        run: |
          CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} \
          cmake -B build -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --target geomflow_tests -j "$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -LE slow

      - name: Run slow C++ mathematics
        if: matrix.os == 'ubuntu-24.04' && matrix.compiler == 'gcc'
        run: ctest --test-dir build --output-on-failure -L slow

  python-source:
    if: github.event_name != 'workflow_dispatch'
    name: Python source / fast mathematics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.dev0
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run fast mathematical suite
        run: python -m pytest -m 'not slow'

  mathematical-slow:
    if: github.event_name != 'workflow_dispatch'
    name: Required slow mathematics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.dev0
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run slow mathematical suite
        run: python -m pytest -m slow

  python-bindings:
    if: github.event_name != 'workflow_dispatch'
    name: Python bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip build pytest

      - name: Build wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.dev0
        run: python -m build --wheel

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Run Python tests
        run: python -m pytest -m 'not slow'

  python-cpu-only:
    if: github.event_name != 'workflow_dispatch'
    name: CPU-only PyTorch wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch and build tools
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.dev0
        run: |
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Verify CPU-only import and tests
        run: |
          python -c 'import torch, geomflow, geomflow.torch; assert torch.version.cuda is None; assert not torch.cuda.is_available()'
          python -m pytest -m 'not slow and not distributed'

  validate-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable version tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z" >&2
            exit 1
          fi

      - name: Require release commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  build-release-wheels:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Wheel / ${{ matrix.platform }}
    needs: [build-test, python-bindings, validate-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - platform: macos-arm64
            runner: macos-15
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-release-sdist:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Source distribution
    needs: [build-test, python-bindings, validate-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build source distribution
        run: python -m build --sdist

      - name: Check source distribution
        run: python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-release-artifacts:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Verify release artifacts
    needs: [build-release-wheels, build-release-sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify artifact set
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import collections
          import pathlib
          import re
          import os

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          expected = os.environ["EXPECTED_VERSION"].removeprefix("v")
          assert len(wheels) == 16, f"expected 16 wheels, found {len(wheels)}"
          assert len(sdists) == 1, f"expected one sdist, found {len(sdists)}"
          versions = {p.name.split("-")[1] for p in wheels + sdists}
          assert versions == {expected}, f"unexpected versions: {versions}"
          interpreters = collections.Counter(
              re.search(r"-(cp\d+)-", p.name).group(1) for p in wheels
          )
          assert interpreters == {
              "cp311": 4,
              "cp312": 4,
              "cp313": 4,
              "cp314": 4,
          }
          for arch in ("x86_64", "aarch64", "arm64"):
              assert any(arch in p.name for p in wheels), f"missing {arch} wheel"
          PY

      - name: Check package metadata
        run: |
          python -m pip install --upgrade check-wheel-contents twine
          check-wheel-contents dist/*.whl
          python -m twine check dist/*

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Publish release to PyPI
    needs: verify-release-artifacts
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/geomflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
