name: CUDA / Vast.ai

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      gpu_count:
        description: Number of GPUs (use two for the DDP release gate)
        type: choice
        options: ['1', '2']
        default: '1'

permissions:
  contents: read
  actions: write

concurrency:
  group: cuda-vast
  cancel-in-progress: false

env:
  VAST_IMAGE: pytorch/pytorch@sha256:3d614dfd422b7e43647491cbf07d6acc516c032fc49c594a94afdebd52552fb9
  VAST_DISK_GB: '30'
  VAST_MIN_RELIABILITY: '0.995'
  VAST_MAX_SINGLE_GPU_DPH: '0.20'
  VAST_MAX_TWO_GPU_DPH: '0.40'
  ACTIONS_RUNNER_VERSION: '2.336.0'
  ACTIONS_RUNNER_SHA256: 04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d

jobs:
  provision:
    name: Provision approved Vast.ai runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vast-gpu
    outputs:
      gpu_count: ${{ steps.provision.outputs.gpu_count }}
      instance_id: ${{ steps.provision.outputs.instance_id }}
      runner_label: ${{ steps.provision.outputs.runner_label }}
    env:
      GH_RUNNER_ADMIN_TOKEN: ${{ secrets.GH_RUNNER_ADMIN_TOKEN }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      REQUESTED_GPU_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_count || '1' }}
    steps:
      - name: Install Vast.ai CLI
        run: python -m pip install --disable-pip-version-check vastai

      - name: Provision ephemeral runner
        id: provision
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_RUNNER_ADMIN_TOKEN:?GH_RUNNER_ADMIN_TOKEN is not configured as a repository secret}"
          instance_id=''
          runner_label=''
          # shellcheck disable=SC2329 # Invoked by the EXIT trap callback.
          remove_runner_registration() {
            local runner_id
            runner_id="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_RUNNER_ADMIN_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              | jq -r --arg name "$runner_label" \
                'first(.runners[] | select(.name == $name) | .id) // empty')"
            if [[ -n "$runner_id" ]]; then
              curl --fail --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer ${GH_RUNNER_ADMIN_TOKEN}" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/${runner_id}"
              echo "Removed GitHub runner registration ${runner_label}"
            fi
          }
          # shellcheck disable=SC2329 # Invoked by the EXIT trap.
          destroy_on_error() {
            status=$?
            trap - EXIT
            if [[ $status -ne 0 && -n "$instance_id" ]]; then
              echo "Vast.ai container logs for failed instance ${instance_id}:" >&2
              vastai --api-key "$VAST_API_KEY" logs "$instance_id" --tail 1000 || true
              vastai --api-key "$VAST_API_KEY" destroy instance "$instance_id" -y || true
            fi
            if [[ $status -ne 0 && -n "$runner_label" ]]; then
              remove_runner_registration || true
            fi
            exit "$status"
          }
          trap destroy_on_error EXIT

          if [[ "$REQUESTED_GPU_COUNT" == '2' ]]; then
            max_dph="$VAST_MAX_TWO_GPU_DPH"
          else
            max_dph="$VAST_MAX_SINGLE_GPU_DPH"
          fi
          runner_label="geomflow-vast-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          query="external=false rentable=true verified=true reliability>=${VAST_MIN_RELIABILITY} num_gpus=${REQUESTED_GPU_COUNT} gpu_frac=1 gpu_ram>=12 disk_space>=${VAST_DISK_GB} inet_down>=200 cuda_vers>=12.4 geolocation in [GB,IE,FR,DE,NL,BE,NO,SE,DK,FI,PL,CZ,AT,CH,ES,PT,IT]"
          offers="$(vastai --api-key "$VAST_API_KEY" search offers "$query" --storage "$VAST_DISK_GB" --order dph --limit 50 --raw)"
          offer="$(jq -cer --argjson cap "$max_dph" 'map(select(.dph_total <= $cap)) | sort_by(.dph_total) | first' <<<"$offers")"
          offer_id="$(jq -er '.id' <<<"$offer")"
          hourly="$(jq -er '.dph_total' <<<"$offer")"
          echo "Selected offer ${offer_id}: $(jq -r '.geolocation + ", " + .gpu_name' <<<"$offer"), reliability $(jq -r '.reliability' <<<"$offer"), USD ${hourly}/hour"

          registration_token="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_RUNNER_ADMIN_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" \
            | jq -er '.token')"
          echo "::add-mask::${registration_token}"

          runner_script="$(cat <<RUNNER
          set -Eeuo pipefail
          export RUNNER_ALLOW_RUNASROOT=1
          install_dir=/opt/actions-runner
          mkdir -p "\$install_dir"
          cd "\$install_dir"
          curl --fail --location --retry 5 --silent --show-error \
            --output runner.tar.gz \
            https://github.com/actions/runner/releases/download/v${ACTIONS_RUNNER_VERSION}/actions-runner-linux-x64-${ACTIONS_RUNNER_VERSION}.tar.gz
          echo '${ACTIONS_RUNNER_SHA256}  runner.tar.gz' | sha256sum --check
          tar -xzf runner.tar.gz
          rm runner.tar.gz
          ./bin/installdependencies.sh
          ./config.sh --unattended --ephemeral --disableupdate \
            --url https://github.com/${GITHUB_REPOSITORY} \
            --token ${registration_token} \
            --name ${runner_label} \
            --labels ${runner_label},cuda,vast-ai \
            --work _work
          exec ./run.sh
          RUNNER
          )"
          encoded_script="$(printf '%s' "$runner_script" | base64 -w 0)"
          created="$(vastai --api-key "$VAST_API_KEY" create instance "$offer_id" \
            --image "$VAST_IMAGE" \
            --disk "$VAST_DISK_GB" \
            --label "$runner_label" \
            --ssh \
            --cancel-unavail \
            --onstart-cmd "printf '%s' '${encoded_script}' | base64 -d > /tmp/geomflow-runner.sh; chmod 700 /tmp/geomflow-runner.sh; exec /tmp/geomflow-runner.sh" \
            --raw)"
          instance_id="$(jq -er '.new_contract' <<<"$created")"
          {
            echo "gpu_count=${REQUESTED_GPU_COUNT}"
            echo "instance_id=${instance_id}"
            echo "runner_label=${runner_label}"
          } >> "$GITHUB_OUTPUT"

          for _ in {1..60}; do
            if curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_RUNNER_ADMIN_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              | jq -e --arg label "$runner_label" \
                '.runners[] | select(.status == "online") | any(.labels[]; .name == $label)' >/dev/null; then
              echo "Runner ${runner_label} is online"
              exit 0
            fi
            sleep 10
          done
          echo "Runner failed to become ready within 10 minutes" >&2
          exit 1

  cuda:
    name: Built wheel / CUDA / PyTorch endpoints
    needs: provision
    runs-on: [self-hosted, linux, x64, '${{ needs.provision.outputs.runner_label }}']
    timeout-minutes: 50
    env:
      GEOMFLOW_REQUIRE_CUDA: '1'
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.dev0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build pytest scipy numpy

      - name: Build and install wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Run paired Phase 1 performance regression gate
        run: |
          git worktree add --detach /tmp/geomflow-phase1 19cf027bd80d336112d9674474d8596d6b4209f3
          python -m pip install --force-reinstall --no-deps \
            --ignore-requires-python -e /tmp/geomflow-phase1
          python /tmp/geomflow-phase1/benchmarks/run.py \
            --scenario euclidean sphere-atlas --batch-size 256 --dim 2 \
            --hidden-width 32 --hidden-depth 2 --steps 16 \
            --dtype float32 --device cpu --workload forward backward \
            --warmup 3 --repetitions 5 --reference \
            --output benchmarks/results/ci-vast-phase1-baseline.json --fail-on-error
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python benchmarks/run.py \
            --scenario euclidean sphere-atlas --batch-size 256 --dim 2 \
            --hidden-width 32 --hidden-depth 2 --steps 16 \
            --dtype float32 --device cpu cuda --workload forward backward \
            --warmup 3 --repetitions 5 --reference \
            --output benchmarks/results/ci-vast-phase10-candidate.json --fail-on-error
          python benchmarks/phase10_regression.py \
            --baseline benchmarks/results/ci-vast-phase1-baseline.json \
            --candidate benchmarks/results/ci-vast-phase10-candidate.json \
            --output benchmarks/results/ci-vast-phase10-regression.json

      - name: Validate maximum PyTorch endpoint
        env:
          GEOMFLOW_ENV_OUTPUT: benchmarks/results/ci-vast-torch27-environment.json
        run: |
          python -c 'import torch; assert torch.__version__.startswith("2.7.")'
          python scripts/gpu_environment.py
          python -m pytest -m 'not distributed' -ra --junitxml=benchmarks/results/ci-vast-torch27.xml

      - name: Run single-chart and multi-chart memory soak
        run: python benchmarks/phase10_soak.py --iterations 40 --output benchmarks/results/ci-vast-soak.json

      - name: Run two-GPU DDP release gate
        if: needs.provision.outputs.gpu_count == '2'
        run: torchrun --standalone --nproc_per_node=2 benchmarks/phase9_distributed.py --output benchmarks/results/ci-vast-ddp.json

      - name: Validate minimum PyTorch endpoint
        env:
          GEOMFLOW_ENV_OUTPUT: benchmarks/results/ci-vast-torch25-environment.json
        run: |
          python -m pip install --force-reinstall torch==2.5.1 --index-url https://download.pytorch.org/whl/cu124
          python -c 'import torch; assert torch.__version__.startswith("2.5.")'
          python scripts/gpu_environment.py
          python -m pytest -m 'not distributed' -ra --junitxml=benchmarks/results/ci-vast-torch25.xml

      - name: Upload CUDA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-vast-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/results/ci-vast-*
          if-no-files-found: warn
          retention-days: 30

  cleanup:
    name: Destroy Vast.ai instance
    if: always()
    needs: [provision, cuda]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_RUNNER_ADMIN_TOKEN: ${{ secrets.GH_RUNNER_ADMIN_TOKEN }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
      RUNNER_LABEL: ${{ needs.provision.outputs.runner_label }}
    steps:
      - name: Destroy and verify instance
        if: env.INSTANCE_ID != ''
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check vastai
          vastai --api-key "$VAST_API_KEY" destroy instance "$INSTANCE_ID" -y || true
          for _ in {1..12}; do
            instances="$(vastai --api-key "$VAST_API_KEY" show instances --raw)"
            if ! jq -e --argjson id "$INSTANCE_ID" 'any(.[]; .id == $id)' <<<"$instances" >/dev/null; then
              echo "Destroyed Vast.ai instance ${INSTANCE_ID}"
              exit 0
            fi
            sleep 5
          done
          echo "Vast.ai instance ${INSTANCE_ID} still exists after cleanup" >&2
          exit 1

      - name: Remove stale runner registration
        if: ${{ always() && env.RUNNER_LABEL != '' }}
        run: |
          set -Eeuo pipefail
          : "${GH_RUNNER_ADMIN_TOKEN:?GH_RUNNER_ADMIN_TOKEN is not configured as a repository secret}"
          runners="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_RUNNER_ADMIN_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"
          runner_id="$(jq -r --arg name "$RUNNER_LABEL" \
            'first(.runners[] | select(.name == $name) | .id) // empty' <<<"$runners")"
          if [[ -z "$runner_id" ]]; then
            echo "Runner registration ${RUNNER_LABEL} is already absent"
            exit 0
          fi
          curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer ${GH_RUNNER_ADMIN_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/${runner_id}"
          echo "Removed GitHub runner registration ${RUNNER_LABEL}"
